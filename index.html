<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BRONEE HRMS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #2E1065 0%, #5C2D91 55%, #7C3AED 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }
    h1 { font-size: 1.75rem; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { opacity: 0.9; line-height: 1.5; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BRONEE HRMS</h1>
    <p>Workforce Management Platform for BRONEE Limited.</p>
    <p style="margin-top:12px;opacity:0.75">Project is connected. Development coming next.</p>
    <div class="badge">GitHub + Cloudflare Pages</div>
  </div>
</body>
</html>
